# Лимиты по IP. Зоны объявляются на уровне http — этот файл подключается внутри http {} (sites-enabled).
limit_req_zone  $binary_remote_addr zone=lis_all:10m   rate=20r/s;   # все запросы
limit_req_zone  $binary_remote_addr zone=lis_form:10m  rate=30r/m;   # отправка формы
limit_req_zone  $binary_remote_addr zone=lis_login:10m rate=10r/m;   # вход в админку
limit_conn_zone $binary_remote_addr zone=lis_conn:10m;

# Запросы по IP-адресу или на чужие домены — сразу закрываем соединение
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name example.ru;          # ← ваш домен (certbot сам добавит HTTPS и редирект)

    server_tokens off;               # не показываем версию nginx

    # защита от медленных и огромных запросов
    client_max_body_size  64k;
    client_body_timeout   10s;
    client_header_timeout 10s;
    keepalive_timeout     15s;
    send_timeout          15s;

    limit_conn lis_conn 30;
    limit_req_status  429;
    limit_conn_status 429;

    # сайт не отвечает — своя страница вместо стандартной ошибки nginx
    error_page 502 503 504 =503 /errors/unavailable.html;
    location = /errors/unavailable.html {
        root /opt/trash-forest/static;
        internal;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "30" always;
    }

    # скрытые файлы (.env, .git и т.п.) — никогда
    location ~ /\. { deny all; return 404; }

    location ^~ /static/ {
        alias /opt/trash-forest/static/;
        expires 7d;
        add_header X-Content-Type-Options nosniff always;
        limit_req zone=lis_all burst=200 nodelay;
    }

    location = /register {
        limit_req zone=lis_form burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /opt/trash-forest/deploy/proxy_params.conf;
    }

    location = /admin/login {
        limit_req zone=lis_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /opt/trash-forest/deploy/proxy_params.conf;
    }

    location / {
        limit_req zone=lis_all burst=40 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /opt/trash-forest/deploy/proxy_params.conf;
    }
}
