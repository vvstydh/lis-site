<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Эту страницу отдаёт сам прокси (Caddy/nginx), когда сайт не отвечает. Через 30 с — новая попытка. -->
  <meta http-equiv="refresh" content="30">
  <meta name="robots" content="noindex">
  <title>Сайт временно недоступен — Битва подразделений</title>
  <meta name="theme-color" content="#081322">
  <link rel="icon" href="/static/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/static/favicon-32.png" sizes="32x32">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="status-page">
    <div class="status-content">
      <span class="status-code">503</span>
      <h1>Сайт временно недоступен</h1>
      <p>Страница обновится через 30 секунд.</p>
      <a class="cta" href="/">Обновить</a>
    </div>
  </main>
</body>
</html>
