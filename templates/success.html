{% extends "status.html" %}
{% block title %}Команда зарегистрирована — {{ event.title }}{% endblock %}
{% block status %}
  <span class="status-sigil" aria-hidden="true">✓</span>
  <h1 class="success-title">
    <span>Ваша команда успешно</span>
    <span>зарегистрирована</span>
  </h1>
  <p>Ждём вас <time datetime="{{ event.date_iso }}">{{ event.date }}</time>!</p>
{% endblock %}
